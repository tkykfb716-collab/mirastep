<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミラステップ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d7ee0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ミラステップ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fb;
  --card:#ffffff;
  --line:#e8ebf2;
  --line-soft:#f0f2f7;
  --ink:#252b38;
  --ink-2:#5b6478;
  --ink-3:#98a1b3;
  --blue:#3d7ee0;
  --blue-soft:#eaf1fd;
  --pink:#e87a9a;  --pink-soft:#fdeef3;
  --teal:#3fa88f;  --teal-soft:#e8f6f2;
  --green:#4caf7d;  --green-soft:#eaf7f0;
  --purple:#8b7ad4; --purple-soft:#f1eefb;
  --amber:#e5a53c; --amber-soft:#fdf4e4;
  --shadow:0 1px 2px rgba(30,40,60,.04),0 4px 14px rgba(30,40,60,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:76px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 24px}

/* header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(247,248,251,.92);
  backdrop-filter:blur(10px);
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  max-width:520px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:8px}
.logo{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(160deg,#7fb4f0,#3d7ee0 60%,#2a5fb0);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.brand-name{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em}
.page-name{font-size:14px;color:var(--ink-2);font-weight:500}
.icon-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--blue);font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* hero */
.hero{
  background:
    linear-gradient(180deg, rgba(20,24,32,.32) 0%, rgba(20,24,32,.12) 38%, rgba(20,24,32,.5) 100%),
    url('hero.jpg') center 55%/cover no-repeat;
  border-radius:18px;padding:20px 18px 16px;margin-bottom:14px;min-height:230px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.hero .date{
  font-size:11.5px;color:rgba(255,255,255,.92);margin-bottom:6px;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:space-between;
  text-shadow:0 1px 4px rgba(0,0,0,.35);
}
.streak{
  display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);
  border-radius:999px;padding:3px 10px 3px 8px;font-size:11.5px;font-weight:500;color:#a3611f;
  text-shadow:none;
}
.hero h1{
  font-family:'Zen Maru Gothic',sans-serif;font-size:21px;font-weight:700;margin:0 0 6px;
  color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);
}
.hero p{font-size:12.5px;color:rgba(255,255,255,.95);margin:0;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.hero-quote{
  margin-top:14px;background:rgba(255,255,255,.85);border-radius:12px;
  padding:12px 14px;font-family:'Zen Maru Gothic',sans-serif;
  font-size:13px;color:#3f4a5e;line-height:1.7;text-align:center;
}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec-title{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px}
.sec-meta{font-size:11.5px;color:var(--ink-3)}
.sec-meta-row{display:flex;align-items:center;gap:10px}
.reorder-btn{
  font-size:11px;color:var(--blue);background:none;border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-family:inherit;cursor:pointer;
}
.reorder-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.task-moves{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.task-moves .move-btn{
  width:22px;height:19px;font-size:10px;border:1px solid var(--line);background:#fff;
  color:var(--ink-2);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.task-moves .move-btn:disabled{opacity:.25}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:6px 4px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:12px;
  font-family:inherit;cursor:pointer;font-weight:500;
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* task row */
.task{
  display:flex;align-items:flex-start;gap:11px;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);
}
.task:last-child{border-bottom:none}
.tick{
  width:21px;height:21px;border-radius:7px;border:1.8px solid #cdd4e0;
  background:#fff;flex-shrink:0;margin-top:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;line-height:1;transition:.15s;
}
.tick.on{background:var(--green);border-color:var(--green)}
.task-main{flex:1;min-width:0}
.task-title{font-size:14px;line-height:1.5;word-break:break-word}
.task.done .task-title{color:var(--ink-3);text-decoration:line-through}
.task-sub{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500}
.mins{font-size:11px;color:var(--ink-3);flex-shrink:0;margin-top:2px}
.del{
  background:none;border:none;color:var(--ink-3);font-size:15px;
  cursor:pointer;padding:0 2px;line-height:1;margin-top:2px;
}

.add-row{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:13px;color:var(--blue);font-size:13px;font-weight:500;
  cursor:pointer;border-top:1px solid var(--line-soft);
}

/* goals ladder */
.goal{border-radius:16px;padding:15px 16px;border:1px solid transparent;position:relative}
.goal-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.goal-check{
  font-size:11.5px;font-weight:500;color:var(--ink-2);
  background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.08);border-radius:999px;
  padding:5px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-block;
}
.goal-check.on{background:var(--green);border-color:var(--green);color:#fff}
.goal.goal-done{opacity:.6}
.goal.goal-done .goal-title{text-decoration:line-through}
.goal.goal-expired{border-color:rgba(192,57,43,.35)}
.period-stepper{
  display:flex;align-items:center;gap:12px;background:#fbfcfe;border:1px solid var(--line);
  border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:500;justify-content:space-between;
}
.pstep{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink-2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;flex-shrink:0;
}
.theme-card{
  background:linear-gradient(135deg,#f4f0fb,#fdf3ea);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;
}
.theme-head{
  font-size:12.5px;font-weight:700;color:#6b5aa8;display:flex;align-items:center;gap:6px;margin-bottom:6px;
}
.theme-edit{margin-left:auto;color:rgba(0,0,0,.3);font-size:12px}
.theme-text{font-size:13.5px;color:#3f4a5e;line-height:1.7;white-space:pre-wrap}
.theme-card.empty .theme-empty{font-size:12.5px;color:#8b7ad4}
.goal-emoji{
  width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
}
.goal-when{font-size:11.5px;font-weight:700;letter-spacing:.03em}
.goal-period{font-weight:500;opacity:.75}
.goal-title{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15.5px;line-height:1.5;margin-bottom:4px}
.goal-note{font-size:12px;color:var(--ink-2);line-height:1.6}
.ladder-arrow{text-align:center;color:#c7cede;font-size:13px;padding:5px 0}
.goal-edit{
  position:absolute;top:12px;right:12px;background:none;border:none;
  color:rgba(0,0,0,.28);font-size:14px;cursor:pointer;padding:2px;
}

/* projects */
.proj{padding:14px 15px;border-bottom:1px solid var(--line-soft)}
.proj:last-child{border-bottom:none}
.proj-head{display:flex;align-items:center;gap:10px}
.proj-emoji{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0;
}
.proj-name{font-weight:500;font-size:14.5px;flex:1;min-width:0}
.proj-pct{font-size:12px;color:var(--ink-2);font-weight:500;flex-shrink:0}
.proj-due{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0;white-space:nowrap}
.proj-due.ok{color:var(--ink-3);background:var(--line-soft)}
.proj-due.soon{color:#a3611f;background:var(--amber-soft)}
.proj-due.over{color:#c0392b;background:#fdeceb}
.proj-caret{background:none;border:none;color:var(--ink-3);font-size:13px;cursor:pointer;padding:2px 0 2px 4px}
.bar{height:6px;border-radius:99px;background:var(--line-soft);margin-top:9px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;transition:width .3s}
.subs{margin-top:10px}
.sub{display:flex;align-items:center;gap:10px;padding:8px 2px}
.sub-title{font-size:13px;flex:1}
.sub.done .sub-title{color:var(--ink-3);text-decoration:line-through}
.tick-s{width:18px;height:18px;border-radius:6px;border:1.6px solid #cdd4e0;background:#fff;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px}
.tick-s.on{background:var(--green);border-color:var(--green)}
.sub-add{font-size:12px;color:var(--blue);padding:8px 2px;cursor:pointer}
.sub-reorder-row{display:flex;justify-content:flex-end;padding:2px 2px 4px}

/* review */
.stat{
  background:linear-gradient(140deg,#fdf6e9,#fdeef2);border-radius:16px;
  padding:18px;text-align:center;margin-bottom:14px;
}
.stat-emoji{font-size:24px}
.stat-label{font-size:12px;color:var(--ink-2);margin:6px 0 2px}
.stat-num{font-family:'Zen Maru Gothic',sans-serif;font-size:34px;font-weight:700;color:var(--amber);line-height:1.1}
.stat-num small{font-size:15px;margin-left:3px}
.stat-msg{font-size:12px;color:var(--ink-2);margin-top:6px}
.week{display:flex;gap:6px;align-items:flex-end;height:96px;padding:14px 14px 0}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wd-bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--line-soft);min-height:4px;transition:height .3s}
.wd-bar.has{background:linear-gradient(180deg,#6ea6ee,#3d7ee0)}
.wd-bar.today{background:linear-gradient(180deg,#f0b45e,#e5a53c)}
.wd-l{font-size:10.5px;color:var(--ink-3)}
.wd-n{font-size:10.5px;color:var(--ink-3)}
.week-note{
  font-size:12.5px;color:var(--ink-2);line-height:1.7;text-align:center;
  padding:14px;border-top:1px solid var(--line-soft);margin-top:10px;
}
.week-note b{color:var(--blue);font-size:15px;font-family:'Zen Maru Gothic',sans-serif}

.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:26px 14px;line-height:1.7}
.footer-quote{
  font-family:'Zen Maru Gothic',sans-serif;text-align:center;
  font-size:12.5px;color:var(--ink-3);margin-top:22px;line-height:1.8;
}

/* nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;padding:7px 0 max(7px,env(safe-area-inset-bottom));
}
.nav-inner{display:flex;width:100%;max-width:520px;margin:0 auto}
.nav-item{
  flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;
  color:var(--ink-3);font-size:10.5px;
}
.nav-item .ic{font-size:17px;line-height:1;opacity:.55}
.nav-item.on{color:var(--blue);font-weight:500}
.nav-item.on .ic{opacity:1}

/* modal */
.ov{position:fixed;inset:0;background:rgba(25,30,42,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.ov{align-items:center}}
.sheet{
  background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
}
@media(min-width:600px){.sheet{border-radius:20px}}
.sheet h2{font-family:'Zen Maru Gothic',sans-serif;font-size:16px;margin:0 0 16px}
.f{margin-bottom:13px}
.f label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  font-size:14px;font-family:inherit;color:var(--ink);background:#fbfcfe;
}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--blue);background:#fff}
.f textarea{resize:vertical;min-height:52px}
.err{color:#d9534f;font-size:11.5px;margin-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  border:1px solid var(--line);background:#fbfcfe;border-radius:999px;
  padding:7px 13px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink-2);
}
.opt.on{border-color:currentColor;font-weight:500}
.acts{display:flex;gap:8px;margin-top:18px}
.btn{
  flex:1;padding:13px;border-radius:12px;font-size:14px;font-family:inherit;
  font-weight:500;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-2);
}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dan{flex:0 0 auto;padding:13px 16px;color:#d9534f;border-color:#f2d5d3}
.loading{text-align:center;color:var(--ink-3);padding:60px 0;font-size:13px}
.warn{
  background:var(--amber-soft);color:#8a6520;border:1px solid #f0dcb6;
  border-radius:12px;padding:10px 13px;font-size:11.5px;line-height:1.6;margin:10px 0 4px;
}
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>
<div class="nav"><div class="nav-inner" id="nav"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
/* ---------- 定数 ---------- */
var TABS=[
  {id:'today',name:'今日',ic:'🏠',head:'今日の一歩'},
  {id:'goals',name:'目標',ic:'🎯',head:'目標'},
  {id:'projects',name:'プロジェクト',ic:'📁',head:'プロジェクト'},
  {id:'review',name:'振り返り',ic:'📊',head:'振り返り'}
];
var CATS=[
  {id:'work',   label:'仕事',    c:'var(--blue)',  bg:'var(--blue-soft)'},
  {id:'seo',    label:'SEO',     c:'var(--teal)',  bg:'var(--teal-soft)'},
  {id:'post',   label:'発信',    c:'var(--pink)',  bg:'var(--pink-soft)'},
  {id:'learn',  label:'学び',    c:'var(--purple)',bg:'var(--purple-soft)'},
  {id:'habit',  label:'習慣',    c:'var(--amber)', bg:'var(--amber-soft)'}
];
var HORIZONS=[
  {id:'future',label:'未来',emoji:'⛰️',c:'var(--pink)',  bg:'var(--pink-soft)'},
  {id:'year',  label:'今年',emoji:'🌱',c:'var(--blue)',  bg:'var(--blue-soft)'},
  {id:'month', label:'今月',emoji:'🏠',c:'var(--green)', bg:'var(--green-soft)'},
  {id:'week',  label:'今週',emoji:'📋',c:'var(--purple)',bg:'var(--purple-soft)'},
  {id:'day',   label:'今日',emoji:'☀️',c:'var(--amber)', bg:'var(--amber-soft)'}
];
var PROJ_EMOJI=['🎓','📖','✏️','📷','💼','🚀','🎨','🎧','🗂️','🌟'];
var PROJ_COLORS=['var(--blue)','var(--teal)','var(--pink)','var(--purple)','var(--amber)','var(--green)'];
var QUOTES=[
  '小さな一歩が、大きな未来をつくる。',
  '未来は、今この瞬間の選択でつくられる。',
  '続けるほど、なりたい自分に近づく。',
  'できる、きっとできる。',
  '今日の一歩が、未来をつくる。',
  '完璧より、まず一歩。',
  '積み重ねた15分が、明日を変える。',
  '迷ったら、未来の自分に聞いてみる。',
  '今日できたことに、目を向けよう。',
  '昨日の自分より、少し前へ。',
  'やるか、やりたい未来に近づくか。',
  '一歩ずつでいい、止まらなければ。'
];

/* ---------- 状態 ---------- */
var S={tab:'today',filter:'all',tasks:[],goals:[],projects:[],log:{},openProj:{},subReorder:{},sheet:null,userName:'たかはる',showDoneGoals:false,updatedAt:0,cloudError:null,weekNotes:{},sessionQuote:QUOTES[Math.floor(Math.random()*QUOTES.length)]};
var root=document.getElementById('root'), navEl=document.getElementById('nav');

/* ---------- 保存(端末ローカル + クラウド同期) ---------- */
function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pad(n){return n<10?'0'+n:''+n}

var KEY='mirastep-data';
var MEM=null;
var STORAGE_OK=true;   /* この端末への保存が生きているか(ローカル) */

/* --- Firebase(Firestore)でのクラウド同期 --- */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyBfupKAAniujgx5TZvsQi9t1dvtQgsnaDc",
  authDomain:"mirastep-180d3.firebaseapp.com",
  projectId:"mirastep-180d3",
  storageBucket:"mirastep-180d3.firebasestorage.app",
  messagingSenderId:"577222995471",
  appId:"1:577222995471:web:56e89249fb425cd6f53d7a"
};
var USER_ID='takaharu-mirastep-main';
var fsDb=null,fsDocRef=null,fsUnsub=null,fsReady=false;
try{
  if(typeof firebase==='undefined'){
    S.cloudError='Firebase SDKが読み込めていません(スクリプトの読み込み失敗)';
  }else{
    firebase.initializeApp(FIREBASE_CONFIG);
    fsDb=firebase.firestore();
    fsDocRef=fsDb.doc('users/'+USER_ID+'/appdata/main');
    fsReady=true;
  }
}catch(e){ fsReady=false; S.cloudError='初期化エラー: '+(e&&e.message||e); }

function payload(){
  return JSON.stringify({tasks:S.tasks,goals:S.goals,projects:S.projects,log:S.log,userName:S.userName,updatedAt:S.updatedAt,weekNotes:S.weekNotes});
}
function apply(str){
  var d=JSON.parse(str);
  S.tasks=d.tasks||[];S.goals=d.goals||[];S.projects=d.projects||[];S.log=d.log||{};
  S.weekNotes=d.weekNotes||{};
  if(d.userName)S.userName=d.userName;
  S.updatedAt=d.updatedAt||0;
}

async function load(){
  var got=false;
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ apply(raw); got=true; }
  }catch(e){ /* この端末に保存できない環境 */ }
  if(!got&&window.storage&&window.storage.get){
    try{ var r=await window.storage.get(KEY,false); if(r&&r.value){apply(r.value);got=true;} }catch(e){}
  }
  if(!got) seed();
  migrateGoalPeriods();
  rollTasks();
  render();
  initCloudSync();
}

var saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  MEM=payload();
  try{ localStorage.setItem(KEY,MEM); if(!STORAGE_OK){STORAGE_OK=true;render();} }
  catch(e){ if(STORAGE_OK){STORAGE_OK=false;render();} }
  if(window.storage&&window.storage.set){
    window.storage.set(KEY,MEM,false).catch(function(){
      window.storage.set(KEY,MEM).catch(function(){});
    });
  }
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,250);
}
function flush(){ pushCloud(MEM); }

function pushCloud(val){
  if(!fsReady) return Promise.resolve();
  return fsDocRef.set({blob:val}).then(function(){
    if(S.cloudError){ S.cloudError=null; render(); }
  }).catch(function(e){
    S.cloudError='保存エラー: '+(e&&e.message||e); render();
  });
}

function initCloudSync(){
  if(!fsReady) return;
  fsDocRef.get().then(function(snap){
    if(snap.exists){
      var remote=snap.data();
      if(remote&&remote.blob){
        var remoteUpdated=0;
        try{ remoteUpdated=(JSON.parse(remote.blob).updatedAt)||0; }catch(e){}
        if(remoteUpdated>(S.updatedAt||0)){
          apply(remote.blob);
          migrateGoalPeriods();
          try{ localStorage.setItem(KEY,remote.blob); }catch(e){}
          rollTasks();render();
        }else if((S.updatedAt||0)>remoteUpdated){
          pushCloud(payload());
        }
      }
    }else{
      pushCloud(payload());
    }
    subscribeCloud();
  }).catch(function(e){ S.cloudError='読み込みエラー: '+(e&&e.message||e); render(); });
}

function subscribeCloud(){
  if(!fsReady||fsUnsub) return;
  fsUnsub=fsDocRef.onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites) return; /* 自分の書き込みのエコーは無視 */
    if(!snap.exists) return;
    var remote=snap.data();
    if(!remote||!remote.blob) return;
    var remoteUpdated=0;
    try{ remoteUpdated=(JSON.parse(remote.blob).updatedAt)||0; }catch(e){ return; }
    if(remoteUpdated>(S.updatedAt||0)){
      apply(remote.blob);
      migrateGoalPeriods();
      try{ localStorage.setItem(KEY,remote.blob); }catch(e){}
      rollTasks();render();
    }
  },function(e){ S.cloudError='リアルタイム同期エラー: '+(e&&e.message||e); render(); });
}

/* 前日以前の未完タスクを今日に繰り越し */
function rollTasks(){
  var t=todayKey(),ch=false;
  S.tasks.forEach(function(x){ if(!x.done&&x.date&&x.date<t){x.date=t;ch=true} });

/* ---------- ヘルパ ---------- */
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function att(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0]}
function hz(id){for(var i=0;i<HORIZONS.length;i++)if(HORIZONS[i].id===id)return HORIZONS[i];return HORIZONS[0]}
function jpDate(d){
  var w=['日','月','火','水','木','金','土'][d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+')';
}
function greet(){var h=new Date().getHours();return h<11?'おはよう':h<18?'こんにちは':'おつかれさま'}
function quote(){
  var d=new Date();
  var start=new Date(d.getFullYear(),0,0);
  var dayOfYear=Math.floor((d-start)/86400000);
  return QUOTES[dayOfYear%QUOTES.length];
}
function todayTasks(){
  var t=todayKey();
  return S.tasks.filter(function(x){return x.date===t})
    .sort(function(a,b){return (a.order||0)-(b.order||0)});
}
function bump(delta){
  var k=todayKey();S.log[k]=Math.max(0,(S.log[k]||0)+delta);
}
function weekDays(){
  var out=[],now=new Date(),dow=(now.getDay()+6)%7; // 月曜起点
  var mon=new Date(now);mon.setDate(now.getDate()-dow);
  for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);
    out.push({key:todayKey(d),label:['月','火','水','木','金','土','日'][i],n:S.log[todayKey(d)]||0,isToday:todayKey(d)===todayKey()});
  }
  return out;
}
function streakCount(){
  var n=0,d=new Date();
  if(!(S.log[todayKey(d)]>0)) d.setDate(d.getDate()-1); // 今日はまだでも継続扱い
  while((S.log[todayKey(d)]||0)>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function horizonPeriod(id){
  var now=new Date();
  if(id==='future') return '5年後〜';
  if(id==='year') return now.getFullYear()+'年';
  if(id==='month') return (now.getMonth()+1)+'月';
  if(id==='week'){
    var dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow);
    var sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return (mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate();
  }
  if(id==='day') return (now.getMonth()+1)+'/'+now.getDate();
  return '';
}

/* 月・週の目標は「いつの分か」を明示的に持てるようにする(先の月・週も計画できる) */
function currentMonthPeriod(){ var n=new Date(); return {y:n.getFullYear(),m:n.getMonth()+1}; }
function currentWeekPeriod(){
  var n=new Date(),dow=(n.getDay()+6)%7,mon=new Date(n);
  mon.setDate(n.getDate()-dow);mon.setHours(0,0,0,0);
  return {monday:todayKey(mon)};
}
function shiftMonthPeriod(p,delta){
  var total=p.y*12+(p.m-1)+delta;
  return {y:Math.floor(total/12),m:(total%12)+1};
}
function shiftWeekPeriod(p,delta){
  var d=new Date(p.monday+'T00:00:00');d.setDate(d.getDate()+delta*7);
  return {monday:todayKey(d)};
}
function monthPeriodLabel(p){ return p.m+'月'; }
function monthPeriodLabelFull(p){
  var c=currentMonthPeriod();
  return (p.y!==c.y?p.y+'年':'')+p.m+'月';
}
function weekPeriodLabel(p){
  var mon=new Date(p.monday+'T00:00:00'),sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return (mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate();
}
function monthPeriodEnd(p){ return new Date(p.y,p.m,0,23,59,59,999); }
function weekPeriodEnd(p){
  var mon=new Date(p.monday+'T00:00:00'),sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return sun;
}
function periodSortKey(g){
  if(g.horizon==='month'&&g.period) return g.period.y*12+g.period.m;
  if(g.horizon==='week'&&g.period) return g.period.monday;
  return 0;
}
function isCurrentPeriod(g){
  if(g.horizon==='month'&&g.period){ var c=currentMonthPeriod(); return g.period.y===c.y&&g.period.m===c.m; }
  if(g.horizon==='week'&&g.period){ var c=currentWeekPeriod(); return g.period.monday===c.monday; }
  return true;
}
function isGoalExpired(g){
  if(g.done) return false;
  if(g.horizon==='month'&&g.period) return monthPeriodEnd(g.period)<new Date();
  if(g.horizon==='week'&&g.period) return weekPeriodEnd(g.period)<new Date();
  return false;
}
/* 既存データ(期間情報を持たない古い目標)に、現在の期間を割り当てて移行する */
function migrateGoalPeriods(){
  S.goals.forEach(function(g){
    if(g.horizon==='month'&&!g.period) g.period=currentMonthPeriod();
    if(g.horizon==='week'&&!g.period) g.period=currentWeekPeriod();
  });
}

function weekThemeCard(){

    var pct=total?Math.round(pdone/total*100):0;
    var due=daysUntil(p.deadline),dueBadge='';
    if(due!=null){
      var cls=due<0?'over':due<=3?'soon':'ok';
      var label=due<0?'期限切れ':due===0?'今日まで':'あと'+due+'日';
      dueBadge='<span class="proj-due '+cls+'">'+label+'</span>';
    }
    return '<div class="proj">'+
      '<div class="proj-head">'+
        '<div class="proj-emoji" style="background:var(--line-soft)">'+p.emoji+'</div>'+
        '<div class="proj-name">'+esc(p.name)+'</div>'+
        dueBadge+
        '<div class="proj-pct">'+pct+'%</div>'+
      '</div>'+
      '<div class="bar"><span style="width:'+pct+'%;background:'+p.color+'"></span></div>'+
    '</div>';
  }).join(''):'';

  var achieved=S.goals.filter(function(g){return g.done});
  var achievedRows=achieved.length?achieved.map(function(g){
    var h=hz(g.horizon);
    return '<div class="task"><div class="tick on">✓</div><div class="task-main">'+
      '<div class="task-title" style="color:var(--ink-2)">'+esc(g.title)+'</div>'+
      '<div class="task-sub"><span class="tag" style="color:'+h.c+';background:'+h.bg+'">'+h.label+'</span></div>'+
      '</div></div>';
  }).join(''):'';

  return '<div class="sec-head"><span class="sec-title">できたことに目を向ける</span></div>'+
    '<div class="stat">'+
      '<div class="stat-emoji">🎉</div>'+
      '<div class="stat-label">今日の一歩</div>'+
      '<div class="stat-num">'+n+'<small>個</small></div>'+
      '<div class="stat-msg">'+msg+'</div>'+
    '</div>'+
    '<div class="sec-head"><span class="sec-title">今日できたこと</span></div>'+
    '<div class="card">'+doneRows+'</div>'+
    '<div class="sec-head"><span class="sec-title">今週の進捗</span></div>'+
    '<div class="card"><div class="week">'+bars+'</div>'+
      '<div class="week-note">今週、未来へ <b>'+wsum+'</b> 歩 進みました!</div></div>'+
    (S.projects.length?(
      '<div class="sec-head"><span class="sec-title">プロジェクトの進捗</span></div>'+
      '<div class="card">'+projRows+'</div>'
    ):'')+
    (achieved.length?(
      '<div class="sec-head"><span class="sec-title">達成した目標</span></div>'+
      '<div class="card">'+achievedRows+'</div>'
    ):'')+
    '<div class="footer-quote">"続けるほど、なりたい自分に近づく。"</div>';
}

/* ---------- モーダル ---------- */
function sheetHTML(){
  var s=S.sheet; if(!s)return '';
  var inner='';
  if(s.type==='task'){
    inner='<h2>'+(s.id?'タスクを編集':'今日の一歩を追加')+'</h2>'+
      '<div class="f"><label>やること</label><input id="i-title" value="'+att(s.title)+'" placeholder="例: 講座のスライドを1枚つくる"><div class="err" id="e-title"></div></div>'+
      '<div class="f"><label>カテゴリ</label><div class="opts">'+
        CATS.map(function(c){return '<button class="opt '+(s.cat===c.id?'on':'')+'" data-pick="cat|'+c.id+'" style="color:'+c.c+';'+(s.cat===c.id?'background:'+c.bg:'')+'">'+c.label+'</button>'}).join('')+
      '</div></div>'+
      '<div class="f"><label>時間</label><div class="opts">'+
        [5,15,30,60].map(function(m){return '<button class="opt '+(s.mins===m?'on':'')+'" data-pick="mins|'+m+'" style="'+(s.mins===m?'color:var(--blue);background:var(--blue-soft)':'')+'">'+m+'分</button>'}).join('')+
      '</div></div>';
  } else if(s.type==='goal'){
    var periodRow='';
    if(s.horizon==='month'&&s.period){
      periodRow='<div class="f"><label>期間</label><div class="period-stepper">'+
        '<button type="button" class="pstep" data-periodstep="-1">‹</button>'+
        '<span>'+monthPeriodLabelFull(s.period)+'</span>'+
        '<button type="button" class="pstep" data-periodstep="1">›</button></div></div>';
    } else if(s.horizon==='week'&&s.period){
      periodRow='<div class="f"><label>期間</label><div class="period-stepper">'+
        '<button type="button" class="pstep" data-periodstep="-1">‹</button>'+
        '<span>'+weekPeriodLabel(s.period)+'</span>'+
        '<button type="button" class="pstep" data-periodstep="1">›</button></div></div>';
    }
    inner='<h2>'+(s.id?'目標を編集':'目標を追加')+'</h2>'+
      '<div class="f"><label>いつの目標?</label><div class="opts">'+
        HORIZONS.map(function(h){return '<button class="opt '+(s.horizon===h.id?'on':'')+'" data-pick="horizon|'+h.id+'" style="color:'+h.c+';'+(s.horizon===h.id?'background:'+h.bg:'')+'">'+h.emoji+' '+h.label+'</button>'}).join('')+
      '</div></div>'+
      periodRow+
      '<div class="f"><label>目標</label><input id="i-title" value="'+att(s.title)+'" placeholder="例: 講座を公開する"><div class="err" id="e-title"></div></div>'+
      '<div class="f"><label>ひとこと(任意)</label><textarea id="i-note" placeholder="具体的な状態や数字">'+esc(s.note)+'</textarea></div>';
  } else if(s.type==='proj'){
    inner='<h2>'+(s.id?'プロジェクトを編集':'プロジェクトを追加')+'</h2>'+
      '<div class="f"><label>名前</label><input id="i-title" value="'+att(s.title)+'" placeholder="例: Udemy講座"><div class="err" id="e-title"></div></div>'+
      '<div class="f"><label>アイコン</label><div class="opts">'+
        PROJ_EMOJI.map(function(e){return '<button class="opt '+(s.emoji===e?'on':'')+'" data-pick="emoji|'+e+'" style="'+(s.emoji===e?'background:var(--blue-soft);color:var(--blue)':'')+'">'+e+'</button>'}).join('')+
      '</div></div>'+
      '<div class="f"><label>色</label><div class="opts">'+
        PROJ_COLORS.map(function(c,i){return '<button class="opt '+(s.color===c?'on':'')+'" data-pick="color|'+i+'" style="background:'+c+';color:#fff;border-color:'+c+';'+(s.color===c?'':'opacity:.42')+'">　</button>'}).join('')+
      '</div></div>'+
      '<div class="f"><label>期限(任意)</label><input type="date" id="i-due" value="'+(s.deadline||'')+'"></div>';
  } else if(s.type==='sub'){
    inner='<h2>ステップを追加</h2>'+
      '<div class="f"><label>内容</label><input id="i-title" value="'+att(s.title)+'" placeholder="例: セクション2を収録"><div class="err" id="e-title"></div></div>';
  } else if(s.type==='weektheme'){
    inner='<h2>今週のテーマ</h2>'+
      '<div class="f"><label>方針・テーマ('+weekPeriodLabel(currentWeekPeriod())+')</label>'+
      '<textarea id="i-title" placeholder="例: 今週は、お金を追わない。教える・伝える・届けることに集中する。" style="min-height:110px">'+esc(s.title)+'</textarea></div>';
  }
  return '<div class="ov" id="ov"><div class="sheet">'+inner+
    '<div class="acts">'+
      ((s.id&&s.type!=='sub')||(s.type==='weektheme'&&s.existing)?'<button class="btn dan" id="b-del">削除</button>':'')+
      '<button class="btn" id="b-cancel">キャンセル</button>'+
      '<button class="btn pri" id="b-ok">'+(s.type==='weektheme'?'保存':(s.id?'保存':'追加'))+'</button>'+
    '</div></div></div>';
}

/* ---------- 描画 ---------- */
function render(){
  var v = S.tab==='today'?viewToday():S.tab==='goals'?viewGoals():S.tab==='projects'?viewProjects():viewReview();
  var tab=TABS.filter(function(t){return t.id===S.tab})[0];

  root.innerHTML=
    '<div class="topbar"><div class="brand"><div class="logo">⛰️</div>'+
      '<span class="brand-name">ミラステップ</span></div>'+
      '<span class="page-name">'+tab.head+'</span></div>'+
    '<div class="wrap">'+
      (STORAGE_OK?'':'<div class="warn">保存機能が使えない環境のようです。この画面を閉じると内容は消えます。</div>')+
      (S.cloudError?'<div class="warn" style="color:#c0392b;background:#fdeceb">同期エラー: '+esc(S.cloudError)+'</div>':'')+
      v+'</div>'+sheetHTML();

  navEl.innerHTML=TABS.map(function(t){
    return '<button class="nav-item '+(S.tab===t.id?'on':'')+'" data-tab="'+t.id+'">'+
      '<span class="ic">'+t.ic+'</span>'+t.name+'</button>';
  }).join('');
  bind();
}

function bind(){
  q('[data-tab]',function(el){el.onclick=function(){S.tab=el.dataset.tab;S.filter='all';render()}});
  q('[data-f]',function(el){el.onclick=function(){S.filter=el.dataset.f;render()}});
  q('[data-reorder]',function(el){el.onclick=function(){S.reorderMode=!S.reorderMode;render()}});
  q('[data-movetask]',function(el){el.onclick=function(){
    var list=todayTasks(),id=el.dataset.movetask,dir=parseInt(el.dataset.move,10);
    var idx=list.findIndex(function(x){return x.id===id}),j=idx+dir;
    if(idx<0||j<0||j>=list.length)return;
    var tmp=list[idx].order; list[idx].order=list[j].order; list[j].order=tmp;
    save();render();
  }});

  q('[data-tick]',function(el){el.onclick=function(){
    var t=find(S.tasks,el.dataset.tick); if(!t)return;
    t.done=!t.done; bump(t.done?1:-1); save(); render();
  }});
  q('[data-deltask]',function(el){el.onclick=function(){
    var t=find(S.tasks,el.dataset.deltask);
    if(t&&t.done)bump(-1);
    S.tasks=S.tasks.filter(function(x){return x.id!==el.dataset.deltask});save();render();
  }});

  q('[data-toggleproj]',function(el){el.onclick=function(){
    var id=el.dataset.toggleproj;S.openProj[id]=!S.openProj[id];render();
  }});
  q('[data-sub]',function(el){el.onclick=function(){
    var p=el.dataset.sub.split('|'),pr=find(S.projects,p[0]);if(!pr)return;
    var s=find(pr.subs,p[1]);if(!s)return;s.done=!s.done;save();render();
  }});
  q('[data-delsub]',function(el){el.onclick=function(){
    var p=el.dataset.delsub.split('|'),pr=find(S.projects,p[0]);if(!pr)return;
    pr.subs=pr.subs.filter(function(x){return x.id!==p[1]});save();render();
  }});
  q('[data-newsub]',function(el){el.onclick=function(){
    S.sheet={type:'sub',id:null,projId:el.dataset.newsub,title:''};render();
  }});
  q('[data-editweektheme]',function(el){el.onclick=function(){
    var wk=currentWeekPeriod().monday;
    var existing=S.weekNotes[wk]||'';
    S.sheet={type:'weektheme',title:existing,existing:!!existing};render();
  }});
  q('[data-subreorder]',function(el){el.onclick=function(){
    var id=el.dataset.subreorder;S.subReorder[id]=!S.subReorder[id];render();
  }});
  q('[data-toggledone]',function(el){el.onclick=function(){
    S.showDoneGoals=!S.showDoneGoals;render();
  }});
  q('[data-movesub]',function(el){el.onclick=function(){
    var parts=el.dataset.movesub.split('|'),pr=find(S.projects,parts[0]);if(!pr)return;
    var idx=pr.subs.findIndex(function(x){return x.id===parts[1]});
    var dir=parseInt(el.dataset.move,10),j=idx+dir;
    if(idx<0||j<0||j>=pr.subs.length)return;
    var tmp=pr.subs[idx]; pr.subs[idx]=pr.subs[j]; pr.subs[j]=tmp;
    save();render();
  }});
  q('[data-editgoal]',function(el){el.onclick=function(){
    var go=find(S.goals,el.dataset.editgoal);if(!go)return;
    S.sheet={type:'goal',id:go.id,title:go.title,note:go.note||'',horizon:go.horizon,period:go.period?JSON.parse(JSON.stringify(go.period)):null};render();
  }});
  q('[data-goaldone]',function(el){el.onclick=function(e){
    e.stopPropagation();
    var go=find(S.goals,el.dataset.goaldone);if(!go)return;
    go.done=!go.done;save();render();
  }});
  q('[data-editproj]',function(el){el.onclick=function(){
    var p=find(S.projects,el.dataset.editproj);if(!p)return;
    S.sheet={type:'proj',id:p.id,title:p.name,emoji:p.emoji,color:p.color,deadline:p.deadline||''};render();
  }});

  q('[data-new]',function(el){el.onclick=function(){
    var k=el.dataset.new;
    if(k==='task')S.sheet={type:'task',id:null,title:'',cat:'work',mins:15};
    if(k==='goal')S.sheet={type:'goal',id:null,title:'',note:'',horizon:'week',period:currentWeekPeriod()};
    if(k==='proj')S.sheet={type:'proj',id:null,title:'',emoji:'🎓',color:PROJ_COLORS[0],deadline:''};
    render();
  }});

  q('[data-pick]',function(el){el.onclick=function(){
    var p=el.dataset.pick.split('|');
    keepInput();
    if(p[0]==='mins')S.sheet.mins=parseInt(p[1],10);
    else if(p[0]==='color')S.sheet.color=PROJ_COLORS[parseInt(p[1],10)];
    else if(p[0]==='horizon'){
      S.sheet.horizon=p[1];
      if(p[1]==='month') S.sheet.period=currentMonthPeriod();
      else if(p[1]==='week') S.sheet.period=currentWeekPeriod();
      else S.sheet.period=null;
    }
    else S.sheet[p[0]]=p[1];
    render();
  }});
  q('[data-periodstep]',function(el){el.onclick=function(){
    keepInput();
    var delta=parseInt(el.dataset.periodstep,10);
    if(S.sheet.horizon==='month') S.sheet.period=shiftMonthPeriod(S.sheet.period,delta);
    else if(S.sheet.horizon==='week') S.sheet.period=shiftWeekPeriod(S.sheet.period,delta);
    render();
  }});

  var ov=document.getElementById('ov');
  if(ov)ov.onclick=function(e){if(e.target===ov){S.sheet=null;render()}};
  var c=document.getElementById('b-cancel'); if(c)c.onclick=function(){S.sheet=null;render()};
  var ok=document.getElementById('b-ok'); if(ok)ok.onclick=submit;
  var dl=document.getElementById('b-del'); if(dl)dl.onclick=doDelete;
  var it=document.getElementById('i-title');
  if(it){it.oninput=function(){var e=document.getElementById('e-title');if(e)e.textContent=''};it.focus();}
}
function q(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn)}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function keepInput(){
  var t=document.getElementById('i-title'),n=document.getElementById('i-note'),d=document.getElementById('i-due');
  if(t)S.sheet.title=t.value; if(n)S.sheet.note=n.value; if(d)S.sheet.deadline=d.value;
}

function submit(){
  keepInput();
  var s=S.sheet;
  if(s.type==='weektheme'){
    var wk=currentWeekPeriod().monday,val=(s.title||'').trim();
    if(val) S.weekNotes[wk]=val; else delete S.weekNotes[wk];
    S.sheet=null;save();render();return;
  }
  var title=(s.title||'').trim();
  if(!title){var e=document.getElementById('e-title');if(e)e.textContent='入力してください';return}

  if(s.type==='task'){
    if(s.id){var t=find(S.tasks,s.id);t.title=title;t.cat=s.cat;t.mins=s.mins}
    else S.tasks.push({id:g(),title:title,cat:s.cat,mins:s.mins,done:false,date:todayKey(),order:Date.now()});
  }
  if(s.type==='goal'){
    if(s.id){var go=find(S.goals,s.id);go.title=title;go.note=(s.note||'').trim();go.horizon=s.horizon;go.period=s.period||null}
    else S.goals.push({id:g(),horizon:s.horizon,title:title,note:(s.note||'').trim(),period:s.period||null});
  }
  if(s.type==='proj'){
    if(s.id){var p=find(S.projects,s.id);p.name=title;p.emoji=s.emoji;p.color=s.color;p.deadline=s.deadline||''}
    else S.projects.push({id:g(),name:title,emoji:s.emoji,color:s.color,subs:[],deadline:s.deadline||''});
  }
  if(s.type==='sub'){
    var pr=find(S.projects,s.projId);
    if(pr){pr.subs.push({id:g(),title:title,done:false});S.openProj[pr.id]=true}
  }
  S.sheet=null;save();render();
}
function doDelete(){
  var s=S.sheet;
  if(s.type==='task')S.tasks=S.tasks.filter(function(x){return x.id!==s.id});
  if(s.type==='goal')S.goals=S.goals.filter(function(x){return x.id!==s.id});
  if(s.type==='proj')S.projects=S.projects.filter(function(x){return x.id!==s.id});
  if(s.type==='weektheme')delete S.weekNotes[currentWeekPeriod().monday];
  S.sheet=null;save();render();
}

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
